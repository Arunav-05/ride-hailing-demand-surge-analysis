name: Render R Markdown project

on:
  push:
    branches: [main]
    paths:
      - "project_notebook.Rmd"
      - ".github/workflows/render-notebook.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libuv1-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("rmarkdown", "knitr", "httr2", "jsonlite", "dplyr", "tidyr", "lubridate", "ggplot2", "scales", "ranger", "slider", "tibble"), repos = "https://cloud.r-project.org")'

      - name: Render notebook
        run: Rscript -e 'rmarkdown::render("project_notebook.Rmd", output_file = "project_notebook.html", quiet = FALSE)'

      - name: Commit rendered report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Render project notebook HTML"
          file_pattern: project_notebook.html
